name: Supabase keep-alive

# Free Supabase projects pause after ~a week of quiet. Touch the database daily.
# Reads the anon-readable `keepalive` table, so the anon key never sees real data.
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$body"
          echo "$body" | grep -q '"id"'
